[package]
name = "aye"
description = "A universal test runner for Python: pytest, unittest, Django and doctest suites, faster and clearer, with token-efficient output for coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["python", "pytest", "unittest", "testing", "test-runner"]
categories = ["command-line-utilities", "development-tools::testing"]
default-run = "aye"

[[bin]]
name = "aye"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
serde_json = { workspace = true }
aye-collect = { workspace = true }
aye-config = { workspace = true }
aye-engine = { workspace = true }
aye-engine-doctest = { workspace = true }
aye-engine-pytest = { workspace = true }
aye-engine-unittest = { workspace = true }
aye-events = { workspace = true }
aye-history = { workspace = true }
aye-provision = { workspace = true }
aye-render = { workspace = true }
aye-runner = { workspace = true }
aye-select = { workspace = true }
aye-static = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
