[project]
name = "shop"
version = "0.1.0"
description = "A tiny shop, tested with unittest: an example project for aye."
requires-python = ">=3.10"

[tool.aye]
adapters = ["unittest"]

[tool.aye.unittest]
# Where discovery starts, and the directory modules are imported from, as in
# `python -m unittest discover -s tests -t .`.
start-directory = "tests"
top-level-directory = "."
